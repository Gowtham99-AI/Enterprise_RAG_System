
services:
  db:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: enterprise-rag-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_rag
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U rag_user -d enterprise_rag
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
